<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cleosushilovers — Japanese authentic sushi. Anchored by grace, served with love. Order online and send your order through Messenger." />
    <meta name="theme-color" content="#f8f4ef" />

    <!-- Link previews (Messenger, Facebook, Viber, etc.). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cleosushilovers" />
    <meta property="og:url" content="https://cleosushilovers.vercel.app/" />
    <meta property="og:title" content="Cleosushilovers — Japanese Authentic Sushi" />
    <meta property="og:description" content="Anchored by grace, served with love. Browse our menu, order online and send your order through Messenger." />
    <meta property="og:image" content="https://cleosushilovers.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cleosushilovers logo" />
    <meta property="og:locale" content="en_PH" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://cleosushilovers.vercel.app/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Cleosushilovers</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      ;(function () {
        try {
          var saved = localStorage.getItem('cleo-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
